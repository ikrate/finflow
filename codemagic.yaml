workflows:
  finflow-release-pipeline:
    name: Finflow Release Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - finflow_credentials # Optional: Configure environment group in Codemagic UI for keys/certs
      vars:
        APP_NAME: "finflow"
        BUNDLE_ID: "com.example.finflow" # Replace with your real bundle ID/package name
    scripts:
      - name: Set up local properties & Flutter dependencies
        script: |
          flutter packages pub get
      - name: Run code analysis & unit tests
        script: |
          flutter analyze
          flutter test
      - name: Build Android App Bundle & APK
        script: |
          # Increment build number or pass via Codemagic environment
          BUILD_NUMBER=$((${BUILD_NUMBER:-1}))
          
          # Build Android App Bundle for Google Play
          flutter build appbundle --release --build-number=$BUILD_NUMBER
          
          # Optional: Build standalone APK for quick testing
          flutter build apk --release --build-number=$BUILD_NUMBER
      - name: Build iOS Application
        script: |
          BUILD_NUMBER=$((${BUILD_NUMBER:-1}))
          
          # Build iOS release archive (no-codesign handles builds without imported Apple certs)
          flutter build ios --release --no-codesign --build-number=$BUILD_NUMBER
    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/*.apk
      - build/ios/iphoneos/*.app
      - build/**/outputs/**/mapping.txt
      - flutter_drive.log
    publishing:
      email:
        recipients:
          - gallageimesh@gmail.com
        notify:
          failure: true
          success: true
